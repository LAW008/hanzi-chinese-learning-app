<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese Learning App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">中文学习 · 今日进度 <span id="progressPercent">0%</span></p>
          <h1>你好！</h1>
        </div>
        <button class="sound-toggle" id="soundToggle" type="button" aria-label="关闭声音">
          <span id="soundIcon" aria-hidden="true">🔊</span>
        </button>
      </header>

      <nav class="tabs" aria-label="学习模式">
        <button class="tab active" type="button" data-view="learn">学习</button>
        <button class="tab" type="button" data-view="review">复习</button>
        <button class="tab" type="button" data-view="quiz">测验</button>
      </nav>

      <section class="view active" id="learnView" aria-labelledby="lessonTitle">
      <section class="lesson-card">
        <div class="lesson-heading">
          <div>
            <p class="eyebrow">基础对话</p>
            <h2 id="lessonTitle">打招呼</h2>
          </div>
          <button class="speaker-button" id="lessonSpeaker" type="button" aria-label="朗读本课">
            <span aria-hidden="true">🔊</span>
            <span>朗读</span>
          </button>
        </div>

        <div class="phrase-list">
          <article class="phrase">
            <button class="phrase-speaker" type="button" data-speech="你好！" aria-label="朗读你好">
              🔊
            </button>
            <div>
              <p class="chinese">你好！</p>
              <p class="pinyin">Nǐ hǎo!</p>
              <p class="translation">Hello!</p>
            </div>
          </article>

          <article class="phrase">
            <button class="phrase-speaker" type="button" data-speech="你叫什么名字？" aria-label="朗读你叫什么名字">
              🔊
            </button>
            <div>
              <p class="chinese">你叫什么名字？</p>
              <p class="pinyin">Nǐ jiào shénme míngzi?</p>
              <p class="translation">What's your name?</p>
            </div>
          </article>

          <article class="phrase">
            <button class="phrase-speaker" type="button" data-speech="很高兴认识你。" aria-label="朗读很高兴认识你">
              🔊
            </button>
            <div>
              <p class="chinese">很高兴认识你。</p>
              <p class="pinyin">Hěn gāoxìng rènshi nǐ.</p>
              <p class="translation">Nice to meet you.</p>
            </div>
          </article>
        </div>
      </section>

      <section class="controls" aria-label="语音设置">
        <label for="speed">语速 <span id="speedValue">正常</span></label>
        <input id="speed" type="range" min="0.6" max="1.2" step="0.1" value="0.9" />
      </section>
      </section>

      <section class="view" id="reviewView" aria-label="复习卡片">
        <article class="flashcard" id="flashcard">
          <div class="flashcard-side">
            <p class="eyebrow" id="cardCount">单词 1 / 3</p>
            <p class="flashcard-chinese" id="cardChinese">你好！</p>
            <p class="flashcard-pinyin" id="cardPinyin">Nǐ hǎo!</p>
          </div>
          <button class="flip-button" id="flipCard" type="button">查看翻译</button>
        </article>
        <div class="review-actions">
          <button type="button" id="rememberButton" class="secondary-button">需要复习</button>
          <button type="button" id="knownButton" class="primary-button">已经认识</button>
        </div>
      </section>

      <section class="view" id="quizView" aria-label="测验">
        <article class="quiz-card">
          <p class="eyebrow" id="quizCount">问题 1 / 3</p>
          <h2 id="quizQuestion">“你好！”是什么意思？</h2>
          <div class="quiz-options" id="quizOptions"></div>
          <p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>
        </article>
      </section>

      <footer class="progress-bar" aria-label="学习进度">
        <span id="progressFill"></span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
